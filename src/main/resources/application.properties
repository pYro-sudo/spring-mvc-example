spring.application.name=lab4ppois
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=15s
spring.data.redis.host=localhost
spring.data.redis.port=6379

#for temporal state I use update, I know it is not recommended, but in my case it is applicable

spring.main.allow-circular-references=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url = jdbc:postgresql://localhost:5432/users
spring.datasource.username = postgres
spring.datasource.password = postgres
spring.jpa.hibernate.ddl-auto = update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.context-path=/lab4ppois/
spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html
spring.web.resources.static-locations=classpath:/static/